[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node scripts/stamp.mjs"

[build.environment]
  # These values are not secrets (addresses and display names) and appear in docs or
  # on the site itself; keep the secrets scanner from failing the build on them.
  SECRETS_SCAN_OMIT_KEYS = "MAIL_FROM,CONTACT_TO,ADMIN_USERNAME,FRIEND_USERNAME,SITE_URL,SITE_BRAND,SITE_LOCALES,SITE_DEFAULT_LOCALE,DEMO_SYMBOL"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/**", "public/index.html"]

# API routes are declared in each function with `export const config = { path }`
# (/api/...). The front end is a static single page using hash routing, so no
# SPA rewrite is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
