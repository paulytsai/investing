[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node scripts/stamp.mjs"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/**"]

# API routes are declared in each function with `export const config = { path }`
# (/api/...). The front end is a static single page using hash routing, so no
# SPA rewrite is needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
