# Theme sectors (spec R-23 / F-39 / D-58 hypothesis; the sector call comes before the stock call). Built from FMP/GICS
# sector + industry, with the AI value chain split out into layers. A name in a non-obvious industry joins an AI layer
# point-in-time when its own earnings calls talk about AI at intensity (theme_mentions, ai_compute family) — the sector's
# membership expands as the theme diffuses, from the start of the AI era in the transcript archive (2015→).
ai_theme_min_per_10k: {value: 3.0, decision_id: D-58, note: "AI-family mentions per 10k words in the two latest calls to join an AI layer from a non-core industry"}
ai_layers:                          # Jensen Huang's five-layer cake: Energy → Chips → Infrastructure → Models → Applications
  ai_energy:                        # all five must scale together; a bottleneck in one constrains the whole system
    label: "AI 1 · Energy — power generation, grid, cooling, power equipment, uranium"
    industries: [Regulated Electric, Independent Power Producers, Renewable Utilities, Diversified Utilities, General Utilities, Uranium, Electrical Equipment & Parts,
                 Industrial - Machinery, Engineering & Construction, Oil & Gas Midstream, Solar, Construction, Industrial - Pollution & Treatment Controls]
    always_industries: [Uranium]
    symbols: [VST, CEG, TLN, NRG, GEV, VRT, CCJ, ETN, OKLO, SMR]
  ai_chips:
    label: "AI 2 · Chips — accelerators, CPUs, networking silicon, memory, fabs, equipment"
    industries: [Semiconductors]
    always: true
    symbols: [NVDA, AMD, AVGO, TSM, ASML, MU, MRVL, ARM, LRCX, AMAT, KLAC, SNDK, WDC, STX]
  ai_infrastructure:
    label: "AI 3 · Infrastructure — AI factories: hyperscale cloud, servers, networking, storage, data-center real estate, DC financing"
    industries: [Computer Hardware, Communication Equipment, "Hardware, Equipment & Parts", Information Technology Services, Software - Infrastructure, REIT - Specialty,
                 Real Estate - Development, Financial - Capital Markets, Technology Distributors, Consumer Electronics]
    always_industries: [Computer Hardware, Communication Equipment]
    symbols: [MSFT, AMZN, ORCL, CRWV, NBIS, DELL, SMCI, ANET, EQIX, DLR, OWL, IBM, IREN, APLD, CIFR, HUT, CORZ, WULF]
  ai_models:
    label: "AI 4 · Models — foundation and specialised models (public proxies; most model builders are private)"
    industries: []
    symbols: [GOOGL, GOOG, META, PLTR, RXRX, SDGR, SOUN, AI, BBAI]
  ai_applications:
    label: "AI 5 · Applications — agents, coding, healthcare, robotics, autonomy, consumer AI"
    industries: [Software - Application, Software - Services, Internet Content & Information, Advertising Agencies, Entertainment, Electronic Gaming & Multimedia,
                 Medical - Healthcare Information Services, Medical - Diagnostics & Research, Medical - Devices, Staffing & Employment Services, Consulting Services,
                 Specialty Business Services, Education & Training Services, Auto - Manufacturers, Aerospace & Defense, Specialty Retail, Security & Protection Services,
                 Internet Retail, Rental & Leasing Services]
fallback_by_sector:                 # a name from any other industry talking about AI at ≥ 2× the threshold joins by its sector
  Utilities: ai_energy
  Energy: ai_energy
  "Real Estate": ai_infrastructure
  "Financial Services": ai_infrastructure
  Technology: ai_infrastructure
  default: ai_applications
theme_sectors:                        # everything else, from the GICS-style sector (FMP profile)
  tech_other:          {label: "Technology (non-AI)",            sectors: [Technology]}
  communication:       {label: "Communication & media",          sectors: [Communication Services]}
  healthcare:          {label: "Healthcare & biotech",           sectors: [Healthcare]}
  financials:          {label: "Financials (ex banks)",          sectors: [Financial Services]}
  industrials:         {label: "Industrials",                    sectors: [Industrials]}
  consumer_cyclical:   {label: "Consumer cyclical",              sectors: [Consumer Cyclical]}
  consumer_defensive:  {label: "Consumer staples",               sectors: [Consumer Defensive]}
  energy:              {label: "Energy",                         sectors: [Energy]}
  materials:           {label: "Materials & mining",             sectors: [Basic Materials]}
  real_estate:         {label: "Real estate",                    sectors: [Real Estate]}
  utilities:           {label: "Utilities (ex AI power)",        sectors: [Utilities]}
  other:               {label: "Other",                          sectors: []}
scoring:                              # sector score = weighted z across sectors at the date (hypothesis, D-58 / D-27)
  weights: {growth: 0.25, momentum: 0.25, quality: 0.20, valuation: 0.15, diffusion: 0.15}
  stance: {overweight_min: 62, underweight_max: 40}
  min_members: 8                      # fewer members → "thin" (neutral, flagged)
  slots: {overweight: 3.0, neutral: 1.0, underweight: 0.25, avoid: 0.0}  # relative slot weights × eligible_members^size_power
  size_power: 0.25                    # weak size effect: the stance decides, the sector's depth only nudges
theme_for_sector:                     # which diffusion theme speaks for each sector (breadth trend input)
  ai_energy: ai_power_grid
  ai_chips: memory_hbm
  ai_infrastructure: ai_compute
  ai_models: ai_compute
  ai_applications: agentic_ai
  healthcare: glp1
  energy: nuclear
  industrials: reshoring
  utilities: ai_power_grid
  real_estate: rates_refinancing
  financials: crypto_digital_assets
  consumer_cyclical: tariffs_trade
  materials: electrification_ev
  tech_other: cybersecurity
  communication: agentic_ai

# Per-sector angle weights (override the preset inside these sectors; hypothesis D-27 / D-58). Backtest evidence (2016–2024, sector-first):
# inside the AI layers the engine's picks lagged their own sector (chips picks +37% vs the chips sector +55%) because the on-sale angle
# pulls toward the cheapest names, while the philosophy says own the indispensable 主役 in a theme: moat, story and momentum first.
angle_weights_override:
  ai_energy:         {story_growth: 0.20, moat: 0.25, quality: 0.15, on_sale: 0.10, asymmetry: 0.05, alignment: 0.05, fundamental_momentum: 0.20, portfolio_fit: 0.00}
  ai_chips:          {story_growth: 0.20, moat: 0.25, quality: 0.15, on_sale: 0.10, asymmetry: 0.05, alignment: 0.05, fundamental_momentum: 0.20, portfolio_fit: 0.00}
  ai_infrastructure: {story_growth: 0.20, moat: 0.25, quality: 0.15, on_sale: 0.10, asymmetry: 0.05, alignment: 0.05, fundamental_momentum: 0.20, portfolio_fit: 0.00}
  ai_models:         {story_growth: 0.20, moat: 0.25, quality: 0.15, on_sale: 0.10, asymmetry: 0.05, alignment: 0.05, fundamental_momentum: 0.20, portfolio_fit: 0.00}
  ai_applications:   {story_growth: 0.20, moat: 0.25, quality: 0.15, on_sale: 0.10, asymmetry: 0.05, alignment: 0.05, fundamental_momentum: 0.20, portfolio_fit: 0.00}
