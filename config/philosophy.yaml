  semis_eps_growth_past_peak_pct: [30, 80]         # §6 M-R23 (PR-9, R-04, R-15, F-29): past cycle peaks; +143% now (2026-09) → expect deceleration; cf. research.earnings_growth_extreme_alert_pct, construction.semi_cycle_gauges
