<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Plans and billing</title>
<!-- Served at /account with a strict CSP (script-src 'self'): no inline scripts or handlers; account.js draws the page. -->
<style>
  :root { --bg:#f7f7f5; --card:#fff; --fg:#1d1d1b; --mut:#6b6b66; --line:#dcdcd6; --acc:#1f5fbf; --acc-fg:#fff; --tag:#ecece6; --hl:#eef3fc;
          --ok-bg:#e8f5ed; --ok-fg:#1e6b3d; --warn-bg:#fdf3e1; --warn-fg:#7a4b00; --err-bg:#fbeaea; --err-fg:#a12a1e; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) { --bg:#161615; --card:#1f1f1d; --fg:#ecebe6; --mut:#a3a29b; --line:#3a3a36; --acc:#5b9bff; --acc-fg:#0d1420; --tag:#2c2c29; --hl:#1d2738;
          --ok-bg:#16301f; --ok-fg:#8fd6a8; --warn-bg:#33270f; --warn-fg:#f0c674; --err-bg:#3a1a17; --err-fg:#f2a49b; }
  }
  :root[data-theme=dark] { --bg:#161615; --card:#1f1f1d; --fg:#ecebe6; --mut:#a3a29b; --line:#3a3a36; --acc:#5b9bff; --acc-fg:#0d1420; --tag:#2c2c29; --hl:#1d2738;
          --ok-bg:#16301f; --ok-fg:#8fd6a8; --warn-bg:#33270f; --warn-fg:#f0c674; --err-bg:#3a1a17; --err-fg:#f2a49b; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 20px 24px 48px; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .back { color: var(--acc); text-decoration: none; font-size: 14px; }
  .back:hover { text-decoration: underline; }
  .langs { display: flex; gap: 6px; }
  .langs button { background: none; border: 1px solid var(--line); border-radius: 6px; color: var(--mut); font: 12px system-ui, sans-serif; padding: 3px 8px; cursor: pointer; }
  .langs button[aria-pressed=true] { color: var(--fg); border-color: var(--fg); }
  h1 { font-size: 26px; margin: 10px 0 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h2 { font-size: 17px; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 0 0 16px; }
  .mut { color: var(--mut); }
  .fine { font-size: 12px; color: var(--mut); margin: 12px 0 0; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--tag); color: var(--fg); vertical-align: middle; letter-spacing: .02em; }
  .tag.acc { background: var(--hl); color: var(--acc); }
  .notice { border-radius: 10px; padding: 10px 14px; margin: 0 0 16px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; }
  .notice.ok { background: var(--ok-bg); color: var(--ok-fg); }
  .notice.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .notice.err { background: var(--err-bg); color: var(--err-fg); }
  .notice button { background: none; border: 0; color: inherit; font-size: 18px; line-height: 1; cursor: pointer; padding: 0 2px; }
  .btn { display: inline-block; font: inherit; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid var(--acc); border-radius: 8px; padding: 9px 14px;
         background: var(--acc); color: var(--acc-fg); text-decoration: none; text-align: center; }
  .btn.sec { background: none; color: var(--acc); }
  .btn[disabled] { opacity: .55; cursor: default; }
  .btn.wide { width: 100%; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  /* current plan */
  .cur-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .cur-name { font-size: 22px; font-weight: 700; margin: 0 8px 0 0; }
  .cur-line { margin: 4px 0 0; }
  table { border-collapse: collapse; width: 100%; }
  .usage { margin-top: 14px; max-width: 520px; }
  .usage td { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .usage td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 12px; }
  /* plans */
  .plans-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .plans-head h2 { margin: 0; }
  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; font-size: 13px; background: none; border: 0; color: var(--mut); padding: 6px 12px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed=true] { background: var(--hl); color: var(--acc); font-weight: 600; }
  .save { font-size: 11px; color: var(--ok-fg); margin-left: 4px; }
  .curpick { font-size: 13px; color: var(--mut); display: inline-flex; gap: 6px; align-items: center; }
  .curpick select { font: inherit; font-size: 13px; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  .plans { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 12px; }
  .plan { border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: var(--card); }
  .plan.is-cur { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc) inset; }
  .plan h3 { margin: 0; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .price { font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .price .per { font-size: 13px; font-weight: 400; color: var(--mut); margin-left: 3px; }
  .sub { font-size: 12.5px; color: var(--mut); min-height: 2.6em; margin: -4px 0 0; }
  .lims { list-style: none; margin: 0; padding: 0; font-size: 13px; flex: 1; }
  .lims li { display: flex; justify-content: space-between; gap: 8px; padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .lims li:last-child { border-bottom: 0; }
  .lims b { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* invoices */
  .inv th { text-align: left; font-size: 12px; color: var(--mut); font-weight: 600; padding: 4px 8px 6px 0; border-bottom: 1px solid var(--line); }
  .inv td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums; }
  .inv td:last-child, .inv th:last-child { text-align: right; padding-right: 0; }
  .inv a { color: var(--acc); }
  .mock { border-style: dashed; border-color: var(--warn-fg); }
  @media (max-width: 560px) {
    .wrap { padding: 12px 16px 40px; }
    h1 { font-size: 22px; }
    .card { padding: 16px; }
    .plans-head { align-items: flex-start; }
    .inv td, .inv th { font-size: 13px; }
    .sub { min-height: 0; }
    .sub:empty { display: none; }
  }
</style>
<script src="/account/account.js" defer></script>
</head>
<body>
<div id="root" class="wrap"><p class="mut">Loading…</p></div>
<noscript><p class="wrap">This page needs JavaScript.</p></noscript>
</body>
</html>
