[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paul-engine"
version = "0.1.0"
description = "Paul Tsai investment engine: ideas with reasons, charts, drivers of past moves, backtest"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "duckdb>=1.1",
  "pyarrow>=17",
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.13",
  "httpx>=0.27",
  "PyYAML>=6",
  "jinja2>=3.1",
  "typer>=0.12",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "anthropic>=1.0",
  "lxml>=5",
  "python-dateutil>=2.9",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.6"]
sync = ["boto3>=1.34"]
mcp = ["mcp>=2.0"]

[project.scripts]
engine = "engine.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engine = ["reports/templates/*.j2", "research/prompts/*.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
